<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#06241a"/>
      <stop offset="60%" stop-color="#050807"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- screen -->
  <rect x="4" y="4" width="56" height="56" rx="12" fill="url(#bg)"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11.5" fill="none" stroke="#1f9e44" stroke-width="1" opacity="0.6"/>

  <!-- prompt: chevron + cursor -->
  <g fill="none" stroke="#33ff66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <polyline points="17,24 28,33 17,42"/>
    <line x1="34" y1="42" x2="47" y2="42"/>
  </g>
</svg>
