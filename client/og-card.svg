<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="-10%" r="100%">
      <stop offset="0%" stop-color="#06241a"/>
      <stop offset="60%" stop-color="#050807"/>
    </radialGradient>
    <radialGradient id="screen" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#06241a"/>
      <stop offset="60%" stop-color="#050807"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="4" fill="transparent"/>
      <rect width="1" height="1" fill="#33ff66" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#scan)"/>

  <!-- terminal icon: rounded screen + prompt glyph -->
  <g transform="translate(150 175)">
    <rect x="0" y="0" width="280" height="280" rx="56" fill="url(#screen)"/>
    <rect x="3" y="3" width="274" height="274" rx="53" fill="none" stroke="#1f9e44" stroke-width="3" opacity="0.6"/>
    <g fill="none" stroke="#33ff66" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <polyline points="74,100 122,140 74,180"/>
      <line x1="148" y1="180" x2="206" y2="180"/>
    </g>
  </g>

  <!-- wordmark -->
  <g filter="url(#textglow)" font-family="'Courier New', monospace">
    <text x="500" y="300" font-size="104" font-weight="700" fill="#33ff66" letter-spacing="-2">uberhacker</text>
    <text x="503" y="370" font-size="27" fill="#1f9e44">&gt; multiplayer fake-hacking party game</text>
  </g>
  <!-- blinking-cursor block after tagline -->
  <rect x="1106" y="346" width="18" height="32" fill="#00e5ff" opacity="0.9" filter="url(#textglow)"/>
</svg>
